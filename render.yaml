services:
  # --- Backend: FastAPI ---
  - type: web
    name: ai-interview-evaluator-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /hello
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # --- Frontend: Streamlit ---
  - type: web
    name: ai-interview-evaluator-frontend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: BACKEND_URL
        fromService:
          type: web
          name: ai-interview-evaluator-backend
          property: hostport